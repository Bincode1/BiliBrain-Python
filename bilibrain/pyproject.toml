[project]
name = "bilibrain"
version = "0.1.0"
description = "Minimal BiliBrain MVP"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.0",
    "curl-cffi>=0.13.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "langchain>=1.2.13",
    "langchain-ollama>=1.0.1",
    "langchain-qwq>=0.3.4",
    "pymilvus>=2.6.0",
    "pymysql>=1.1.1",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "qrcode>=8.2",
    "uvicorn>=0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

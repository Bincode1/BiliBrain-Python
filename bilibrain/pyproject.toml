[project]
name = "bilibrain"
version = "0.1.0"
description = "Minimal BiliBrain MVP"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "curl-cffi>=0.13.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.2.13",
    "langchain-ollama>=1.0.1",
    "langchain-qwq>=0.3.4",
    "langgraph>=1.1.3",
    "pandas>=2.2.3",
    "rank-bm25>=0.2.2",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "qrcode>=8.2",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.48",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
